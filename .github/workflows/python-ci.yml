name: Python CI

on:
  push:
    branches: [ master, trabajo/optimizar-scraper ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f verificacion_oem/requirements.txt ]; then pip install -r verificacion_oem/requirements.txt; fi

      - name: Run tests
        run: |
          python -m pytest -q
